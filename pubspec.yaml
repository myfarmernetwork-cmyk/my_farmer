name: my_farmer
description: "A new Flutter project for farmers marketplace."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0
  flutter_riverpod: ^2.4.9
  image_picker: ^1.0.7
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  path: ^1.8.3
  cupertino_icons: ^1.0.6
  easy_localization: ^3.0.8
  http: ^1.2.2
  purchases_flutter: ^8.1.0
  flutter_stripe: ^11.5.0
  cloud_functions: ^5.1.3
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.3
  translator: ^1.0.3+1
  file_picker: ^8.1.2
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  mobile_scanner: ^7.2.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/translations/en.json
    - assets/translations/de.json
    - assets/translations/hr.json
    - assets/translations/hr-HR.json
    - assets/translations/bs.json
    - assets/translations/sr.json
    - assets/translations/sr-RS.json
    - assets/translations/pl.json
    - assets/translations/sv.json
    - assets/translations/es.json
    - assets/translations/fr.json
    - assets/translations/cs.json
    - assets/translations/zh.json
    - assets/translations/uk.json
    - assets/translations/ru.json
    - assets/translations/hi.json
    - assets/translations/id.json
    - assets/translations/sw.json
    - assets/translations/ar.json
    - assets/translations/it.json
    - assets/translations/tr.json
    - assets/docs/My_Farmer_Uloge_i_Pretplate.pdf
    - assets/docs/My_Farmer_Beta_Test_Upute.pdf